name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "hub/**"
      - "firebase.json"
      - ".firebaserc"
      - "scripts/deploy/deploy-firebase.sh"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write Firebase service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Build and deploy
        run: bash scripts/deploy/deploy-firebase.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
